<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100;400;700&display=swap" rel="stylesheet">

    <script src="script.js" defer></script>
    <title>Cronômetro</title>
</head>
<body>

    <div id="container">
        <h1>Cronômetro Digital</h1>
        <p><span id="hour"></span>:<span id="minutes"></span>:<span id="seconds"></span><span id="milliseconds"></span></p>
        <div class="button">
            <button type="submit" id="reset">Zerar</button>
            <button type="submit" id="start-stop">Iniciar/Pausar</button>
        </div>
    </div>
    
</body>
</html>
